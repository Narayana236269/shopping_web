<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Online Shopping</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
  </head>
  <style>
    * {
      margin: 0px;
      padding: 0px;
    }
    body {
      display: grid;
      grid-template-columns: 20vw 79vw;
      grid-template-rows: 200vh 100vh;
    }
    .category {
      background-color: rgb(235, 180, 113);
      border: 5px black solid;
    }
    .products {
      /* background-color: rgb(235, 214, 174);
      background-color: rgb(133, 147, 234); */
    }
    .headers {
      display: flex;
      justify-content: space-evenly;
      border: 5px solid;
      /* background:linear-gradient(wh); */
      background-color: rgb(235, 180, 113);
      border-radius: 5px;
    }
    #scr_symbol {
      margin-left: 500px;
    }

    .scarch {
      width: 30%;
      height: 100px;
      font-size: 18px;
      border-radius: 5px;
      position: relative;
      font-size: 40px;
      font-weight: bold;
      border-radius: 5px;
      border: 5px solid black;
    }

    .material-symbols-outlined {
      color: blackx;
      font-size: 5vh;
      border: 5px solid black;
      cursor: pointer;
    }
    .category-list {
      color: rgb(7, 3, 3);
      padding: 10px;
      margin: auto;
      align-items: center;
      font-size: 60px;
    }
    .elements {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      padding: 20px;
    }
    img {
      height: 20vh;
      width: 10vw;

      padding: 50x;
    }

    .prod_info {
      height: 30vh;
      width: 10vw;
      font-size: 20px;
      /* background: linear-gradient(
        to bottom right,
        rgb(8, 100, 198),
        rgb(133, 192, 192)
      ); */

      border-radius: 10px;
      border: 5px grey solid;
      display: flex;
      flex-flow: column;
      justify-content: space-between;
      align-items: center;
    }
  </style>
  <body>
    <div class="category">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        height="100px"
        viewBox="0 -960 960 960"
        width="100px"
        fill="#e3e3e3"
      >
        <path
          d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"
        />
      </svg>
      <ul class="category-list" id="category"></ul>
    </div>
    <div class="products">
      <div class="headers">
        <span class="material-symbols-outlined" id="scr_symbol"> search </span>
        <input type="text" id="scarch" class="scarch" />

        <span class="material-symbols-outlined"> shopping_cart </span>
        <span class="material-symbols-outlined"> account_box </span>
      </div>

      <div class="elements" id="elements"></div>
    </div>
  </body>
  <script src="app_logic.js"></script>
</html>
